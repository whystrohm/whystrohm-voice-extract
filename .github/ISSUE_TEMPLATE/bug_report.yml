name: Bug Report
description: The skill produced unexpected output or broke during the voice extraction
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Run `claude --version` in your terminal
      placeholder: "e.g., 2.1.84"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Which step broke?
      options:
        - URL and scrape (Step 1-2)
        - Voice dimensions (Step 3)
        - Vocabulary patterns (Step 4)
        - Positioning signals (Step 5)
        - Starter guardrails (Step 6)
        - Voice profile display (Step 7)
        - CTA (Step 8)
        - Other
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Website URL (if you can share it)
      description: The public site you ran the extraction on
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the unexpected behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: output-sample
    attributes:
      label: Output sample (if relevant)
      description: Paste the part of the voice profile that looks wrong
      render: text
