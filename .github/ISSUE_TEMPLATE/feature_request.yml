name: Feature Request
description: Suggest an improvement to the voice extract skill
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Voice dimensions (add/modify dimensions or criteria)
        - Vocabulary analysis
        - Guardrail generator
        - Profile format (how results are displayed)
        - Flow (how the extraction progresses)
        - CTA
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does this improve the extraction?
      description: How does this help the end user?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example (optional)
      description: If proposing a scoring change, show how a profile would differ
